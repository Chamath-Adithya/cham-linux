name: Feature request
description: Suggest an improvement to Cham Linux.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Describe your idea
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context or alternatives
