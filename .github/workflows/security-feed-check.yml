name: Ubuntu security feed availability
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'system/check-ubuntu-oval.py'
      - 'tests/test_security_feed.py'
      - '.github/workflows/security-feed-check.yml'
permissions:
  contents: read
jobs:
  feed-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test failure handling
        run: python3 tests/test_security_feed.py
      - name: Check feed and publish job summary
        run: |
          set -o pipefail
          python3 system/check-ubuntu-oval.py | tee -a "$GITHUB_STEP_SUMMARY"
