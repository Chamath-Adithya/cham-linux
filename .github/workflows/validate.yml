name: Validate
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck ripgrep python3-yaml
      - name: Validate and build
        run: make package
      - name: Check interactive installer configuration
        run: python3 tests/iso-config.py
      - name: Verify package
        run: cd dist && sha256sum -c SHA256SUMS && dpkg-deb --info *.deb && dpkg-deb --contents *.deb
      - name: Smoke test install, reinstall and removal in an isolated Ubuntu container
        run: |
          mkdir -p /tmp/cham-old
          dpkg-deb -R dist/*.deb /tmp/cham-old
          sed -i 's/^Version:.*/Version: 0.0.1~smoketest/' /tmp/cham-old/DEBIAN/control
          dpkg-deb --build /tmp/cham-old /tmp/cham-old.deb
          docker run --rm -v "$PWD/dist:/packages:ro" ubuntu:24.04 bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends /packages/*.deb
            dpkg -s cham-linux-core | grep -Fx "Status: install ok installed"
            apt-get install -y --reinstall --no-install-recommends /packages/*.deb
            apt-get remove -y cham-linux-core
            ! dpkg -s cham-linux-core 2>/dev/null | grep -Fx "Status: install ok installed"
          '
          docker run --rm -v "$PWD/dist:/packages:ro" -v /tmp/cham-old.deb:/tmp/cham-old.deb:ro ubuntu:24.04 bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends /tmp/cham-old.deb
            apt-get install -y --no-install-recommends /packages/*.deb
            dpkg -s cham-linux-core | grep -Fx "Status: install ok installed"
            ! dpkg -s cham-linux-core | grep -Fx "Version: 0.0.1~smoketest"
          '
