name: Validate
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck ripgrep python3-yaml
      - name: Validate and build
        run: make package
      - name: Check interactive installer configuration
        run: python3 tests/iso-config.py
      - name: Verify package
        run: cd dist && sha256sum -c SHA256SUMS && dpkg-deb --info *.deb && dpkg-deb --contents *.deb
